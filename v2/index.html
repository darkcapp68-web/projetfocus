<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>projetfocus 2</title>
  <meta name="theme-color" content="#1c1a4d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="btn-settings" type="button" aria-haspopup="dialog">Paramètres<span id="update-dot" hidden></span></button>
  </header>

  <main></main>

  <footer id="player">
    <div class="radio">
      <button id="btn-radio" type="button" aria-label="Lancer la radio">
        <svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="stop" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <div class="radio-text">
        <div id="radio-name">Radio Technolovers Minimal</div>
        <div id="radio-state">minimal techno</div>
      </div>
    </div>
    <input id="volume" type="range" min="0" max="100" step="1" aria-label="Volume">
  </footer>

  <dialog id="settings" aria-label="Paramètres">
    <div class="sheet">
      <div class="sheet-head">
        <h2>Paramètres</h2>
        <button id="btn-close" type="button" aria-label="Fermer">✕</button>
      </div>
      <p class="version">Version <span id="version"></span></p>
      <p id="update-info" class="hint"></p>
      <button id="btn-update" type="button" class="wide">Mettre à jour l'appli</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
