<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>projetfocus 2</title>
  <meta name="theme-color" content="#1c1a4d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="btn-settings" type="button" aria-haspopup="dialog">Paramètres<span id="update-dot" hidden></span></button>
  </header>

  <main>
    <div id="dial-row">
    <!-- Préréglages focus / pause, à gauche de l'horloge, seulement avant Démarrer. -->
    <div id="presets" aria-label="Préréglages">
      <button type="button" class="preset" data-f="25" data-b="5">25<span>5</span></button>
      <button type="button" class="preset" data-f="50" data-b="10">50<span>10</span></button>
      <button type="button" class="preset" data-f="90" data-b="20">90<span>20</span></button>
    </div>
    <!-- Horloge (cadran de la 1.0, style « Normal ») : on la tourne pour régler 1 à 90 min. -->
    <div id="dial-wrap">
      <svg id="dial" viewBox="0 0 300 300" role="slider" tabindex="0" aria-label="Durée du focus en minutes"
           aria-valuemin="1" aria-valuemax="90" aria-valuenow="25">
        <circle class="track" cx="150" cy="150" r="128"/>
        <g id="ticks"></g>
        <circle id="arc" cx="150" cy="150" r="128" transform="rotate(-90 150 150)"/>
        <circle id="knob" cx="150" cy="22" r="7"/>
      </svg>
      <div id="center">
        <div id="time">25:00</div>
        <div id="sub">focus</div>
      </div>
    </div>
    </div>
    <!-- Au repos : ce que règle l'horloge (comme la 1.0). Pendant le focus : « Pause maintenant ». -->
    <div id="setup">
      <button type="button" id="edit-focus" class="seg on">focus <b id="v-focus">25</b> min</button>
      <button type="button" id="edit-break" class="seg">pause <b id="v-break">5</b> min</button>
    </div>
    <button id="btn-break" type="button">Pause maintenant</button>
    <button id="btn-start" type="button" class="primary">Démarrer</button>
  </main>

  <footer id="player">
    <!-- Onde en ligne (reprise de la 1.0, « Rythme · Onde horizontale ») : réagit à la radio. -->
    <canvas id="wave" aria-hidden="true"></canvas>
    <div class="radio">
      <button id="btn-radio" type="button" aria-label="Lancer la radio">
        <svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="stop" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <div class="radio-text">
        <div id="radio-name">Radio Technolovers Minimal</div>
        <div id="radio-state">minimal techno</div>
      </div>
    </div>
    <input id="volume" type="range" min="0" max="100" step="1" aria-label="Volume">
  </footer>

  <dialog id="settings" aria-label="Paramètres">
    <div class="sheet">
      <div class="sheet-head">
        <h2>Paramètres</h2>
        <button id="btn-close" type="button" aria-label="Fermer">✕</button>
      </div>
      <p class="version">Version <span id="version"></span></p>
      <p id="update-info" class="hint"></p>
      <button id="btn-update" type="button" class="wide">Mettre à jour l'appli</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
