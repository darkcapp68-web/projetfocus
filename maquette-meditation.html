<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Méditation dorée</title>
<style>
  :root { --bg: #0d0a14; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 50%, #221810 0%, var(--bg) 62%); color: #fff; font: 400 15px/1.4 system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; align-items: center; padding: 18px 12px 30px; }
  h1 { font-weight: 400; font-size: 18px; margin: 0 0 10px; opacity: 0.9; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; justify-content: center; }
  .row button { font: inherit; font-size: 13px; color: #fff; background: rgba(255,255,255,0.06); border: 1px solid rgba(242,196,90,0.45); border-radius: 99px; padding: 6px 14px; cursor: pointer; }
  .row button.on { background: rgba(242,196,90,0.22); }
  svg { width: min(500px, 96vw); height: auto; overflow: visible; }
  .wheel { transform-origin: 300px 300px; animation: spin 120s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .syl { animation: float 9s ease-in-out infinite; }
  .syl.s2 { animation-delay: -2.2s; } .syl.s3 { animation-delay: -4.5s; } .syl.s4 { animation-delay: -6.7s; }
  @keyframes float { 0%, 100% { transform: translateY(0); opacity: 0.75; } 50% { transform: translateY(-10px); opacity: 0.45; } }
  .wave { animation: wave 6s ease-in-out infinite alternate; }
  @keyframes wave { to { transform: translateX(-90px); } }
  body.pause .solar, body:not(.pause) .water { display: none; }
  body.cote .dessous, body:not(.cote) .cote { display: none; }
</style>
</head>
<body class="cote">
<h1>Méditation dorée, version allégée</h1>
<div class="row">
  <button data-hands="cote" class="on">Mains de chaque côté</button>
  <button data-hands="dessous">Mains ensemble en dessous</button>
</div>
<div class="row">
  <button data-mode="focus" class="on">Focus (système solaire)</button>
  <button data-mode="pause">Pause (eau)</button>
</div>

<svg viewBox="0 0 600 600" aria-label="Orbe tenu entre deux mains">
  <defs>
    <radialGradient id="orb" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#2b2140"/>
      <stop offset="0.88" stop-color="#140f22"/>
      <stop offset="1" stop-color="#f2c45a" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="sun" r="50%">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.35" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d98e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b9842c" stop-opacity="0.75"/>
    </linearGradient>
    <clipPath id="orbclip"><circle cx="300" cy="300" r="106"/></clipPath>
    <!-- Une main, paume vers la droite, doigts vers le haut (dessinée une fois, retournée pour l'autre) -->
    <g id="sidehand" fill="url(#hand)">
      <rect x="0" y="62" width="64" height="86" rx="26"/>
      <rect x="2" y="12" width="14" height="70" rx="7"/>
      <rect x="18" y="0" width="14" height="80" rx="7"/>
      <rect x="34" y="6" width="14" height="76" rx="7"/>
      <rect x="49" y="22" width="13" height="62" rx="6.5"/>
      <rect x="54" y="78" width="15" height="52" rx="7.5" transform="rotate(-38 61 104)"/>
      <rect x="10" y="140" width="44" height="40" rx="12"/>
    </g>
  </defs>

  <!-- Roue discrète en auréole, derrière l'orbe -->
  <g class="wheel" stroke="#f2c45a" fill="none" opacity="0.35">
    <circle cx="300" cy="300" r="150" stroke-width="1.5"/>
    <circle cx="300" cy="300" r="140" stroke-width="0.8" stroke-dasharray="2 6"/>
    <g id="spokes" stroke-width="0.8"></g>
  </g>

  <!-- Symboles flottants -->
  <g font-size="46" fill="#ffd27a" text-anchor="middle" dominant-baseline="central" style="font-family: 'Noto Sans Devanagari', 'Nirmala UI', serif;">
    <text class="syl" x="120" y="120">अ</text>
    <text class="syl s2" x="480" y="120">हूं</text>
    <text class="syl s3" x="95" y="460">ह्रीः</text>
    <text class="syl s4" x="505" y="460">ॐ</text>
  </g>

  <!-- Orbe -->
  <circle cx="300" cy="300" r="110" fill="url(#orb)" stroke="#f2c45a" stroke-width="1.8" stroke-opacity="0.8"/>
  <g clip-path="url(#orbclip)">
    <g class="solar">
      <g id="orbits" fill="none" stroke="rgba(255,231,163,0.18)" stroke-width="0.8"></g>
      <g id="back"></g>
      <circle cx="300" cy="300" r="24" fill="url(#sun)"/>
      <circle cx="300" cy="300" r="7" fill="#ffe7a3"/>
      <g id="front"></g>
      <path id="tail" fill="rgba(255,255,255,0.45)"/><circle id="head" r="2.3" fill="#fff"/>
    </g>
    <g class="water">
      <g transform="translate(0 325)">
        <g class="wave">
          <path d="M170 0 q22 -7 45 0 t45 0 t45 0 t45 0 t45 0 t45 0 t45 0 V 120 H 170 Z" fill="#7fd8e8" opacity="0.8"/>
          <path d="M170 4 q22 7 45 0 t45 0 t45 0 t45 0 t45 0 t45 0 t45 0 V 120 H 170 Z" fill="#bff0f7" opacity="0.45"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Version 1 : une main de chaque côté, paumes tournées vers l'orbe -->
  <g class="cote">
    <use href="#sidehand" transform="translate(112 214)"/>
    <use href="#sidehand" transform="translate(488 214) scale(-1 1)"/>
  </g>

  <!-- Version 2 : les deux mains ensemble en dessous, en coupe, les pouces qui se touchent -->
  <g class="dessous" fill="url(#hand)">
    <path d="M168 400
             C 172 470, 232 512, 300 514
             C 368 512, 428 470, 432 400
             C 424 392, 414 394, 410 404
             C 404 452, 356 486, 300 488
             C 244 486, 196 452, 190 404
             C 186 394, 176 392, 168 400 Z"/>
    <g>
      <rect x="168" y="372" width="18" height="44" rx="9" transform="rotate(-18 177 394)"/>
      <rect x="186" y="386" width="18" height="46" rx="9" transform="rotate(-30 195 409)"/>
      <rect x="206" y="404" width="18" height="44" rx="9" transform="rotate(-44 215 426)"/>
      <rect x="414" y="372" width="18" height="44" rx="9" transform="rotate(18 423 394)"/>
      <rect x="396" y="386" width="18" height="46" rx="9" transform="rotate(30 405 409)"/>
      <rect x="376" y="404" width="18" height="44" rx="9" transform="rotate(44 385 426)"/>
    </g>
    <path d="M300 430 C 284 418, 262 418, 252 428 C 262 440, 284 444, 300 438 C 316 444, 338 440, 348 428 C 338 418, 316 418, 300 430 Z"/>
    <rect x="242" y="508" width="116" height="34" rx="14"/>
  </g>
</svg>

<script>
  const ns = 'http://www.w3.org/2000/svg';
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2, l = document.createElementNS(ns, 'line');
    l.setAttribute('x1', 300 + 118 * Math.cos(a)); l.setAttribute('y1', 300 + 118 * Math.sin(a));
    l.setAttribute('x2', 300 + 140 * Math.cos(a)); l.setAttribute('y2', 300 + 140 * Math.sin(a));
    document.getElementById('spokes').appendChild(l);
  }
  const P = [[24,1.5,'#a8a39d',14],[33,2.1,'#e8cf9c',24],[42,2.3,'#4a8fd8',36],[51,1.8,'#c8532a',60],[65,4.6,'#d9b38c',140],[78,3.9,'#e6c97f',230,1],[89,2.8,'#9fe0e6',420],[99,2.7,'#4466d8',700]];
  const TILT = -14 * Math.PI / 180, F = 0.32, CX = 300, CY = 300;
  const back = document.getElementById('back'), front = document.getElementById('front');
  const pl = P.map(([r, s, c, per, ring], i) => {
    const o = document.createElementNS(ns, 'ellipse');
    o.setAttribute('cx', CX); o.setAttribute('cy', CY); o.setAttribute('rx', r); o.setAttribute('ry', r * F);
    o.setAttribute('transform', `rotate(-14 ${CX} ${CY})`); document.getElementById('orbits').appendChild(o);
    const g = document.createElementNS(ns, 'g');
    const ci = document.createElementNS(ns, 'circle'); ci.setAttribute('r', s); ci.setAttribute('fill', c); g.appendChild(ci);
    if (ring) { const e = document.createElementNS(ns, 'ellipse'); e.setAttribute('rx', s * 2.2); e.setAttribute('ry', s * 0.7); e.setAttribute('fill', 'none'); e.setAttribute('stroke', c); e.setAttribute('transform', 'rotate(-14)'); g.appendChild(e); }
    back.appendChild(g);
    return { r, per, g, ph: i * 1.7 };
  });
  const t0 = Date.now();
  function frame() {
    const t = Date.now() / 1000;
    for (const p of pl) {
      const a = p.ph + (t / p.per) * 2 * Math.PI;
      const ex = p.r * Math.cos(a), ey = p.r * F * Math.sin(a);
      const x = CX + ex * Math.cos(TILT) - ey * Math.sin(TILT), y = CY + ex * Math.sin(TILT) + ey * Math.cos(TILT);
      p.g.setAttribute('transform', `translate(${x} ${y}) scale(${1 + 0.22 * Math.sin(a)})`);
      const want = Math.sin(a) > 0 ? front : back; if (p.g.parentNode !== want) want.appendChild(p.g);
    }
    const prog = ((Date.now() - t0) / 60000) % 1;
    const d = 106 - prog * 92, ang = (-40 + prog * 70) * Math.PI / 180;
    const hx = CX + d * Math.cos(ang), hy = CY + d * Math.sin(ang), ux = Math.cos(ang), uy = Math.sin(ang), len = 12 + 16 * prog;
    document.getElementById('head').setAttribute('cx', hx); document.getElementById('head').setAttribute('cy', hy);
    document.getElementById('tail').setAttribute('d', `M ${hx - uy * 1.8} ${hy + ux * 1.8} L ${hx + ux * len} ${hy + uy * len} L ${hx + uy * 1.8} ${hy - ux * 1.8} Z`);
    requestAnimationFrame(frame);
  }
  frame();
  const set = (k, v) => { document.body.classList.toggle(k, v); };
  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
    set('pause', b.dataset.mode === 'pause');
    document.querySelectorAll('[data-mode]').forEach((x) => x.classList.toggle('on', x === b));
  }));
  document.querySelectorAll('[data-hands]').forEach((b) => b.addEventListener('click', () => {
    set('cote', b.dataset.hands === 'cote');
    document.querySelectorAll('[data-hands]').forEach((x) => x.classList.toggle('on', x === b));
  }));
</script>
</body>
</html>
