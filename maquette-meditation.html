<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Méditation dorée</title>
<style>
  :root { --bg: #0d0a14; --gold: #f2c45a; --gold2: #ffe7a3; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 45%, #2a1c10 0%, var(--bg) 60%); color: #fff; font: 400 15px/1.4 system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; align-items: center; padding: 18px 12px 30px; }
  h1 { font-weight: 400; font-size: 18px; margin: 0 0 4px; opacity: 0.9; }
  p.sub { margin: 0 0 10px; font-size: 13px; opacity: 0.65; text-align: center; max-width: 46ch; }
  .modes { display: flex; gap: 8px; margin-bottom: 8px; }
  .modes button { font: inherit; font-size: 13px; color: #fff; background: rgba(255,255,255,0.08); border: 1px solid rgba(242,196,90,0.5); border-radius: 99px; padding: 6px 14px; cursor: pointer; }
  .modes button.on { background: rgba(242,196,90,0.25); }
  svg { width: min(520px, 96vw); height: auto; overflow: visible; }
  .flame { transform-origin: 300px 330px; animation: flicker 3.2s ease-in-out infinite alternate; }
  .flame.f2 { animation-duration: 4.1s; animation-delay: -1s; }
  @keyframes flicker { 0% { transform: scale(1); opacity: 0.85; } 100% { transform: scale(1.025, 1.04); opacity: 1; } }
  .wheel { transform-origin: 300px 205px; animation: spin 80s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .syl { animation: breathe 6s ease-in-out infinite; }
  .syl.s2 { animation-delay: -1.5s; } .syl.s3 { animation-delay: -3s; } .syl.s4 { animation-delay: -4.5s; }
  @keyframes breathe { 50% { opacity: 0.35; } }
  .orb-glow { animation: glow 5s ease-in-out infinite alternate; transform-origin: 300px 395px; }
  @keyframes glow { to { transform: scale(1.06); opacity: 0.8; } }
  .wave { animation: wave 6s ease-in-out infinite alternate; }
  @keyframes wave { to { transform: translateX(-90px); } }
  .mode-pause .solar, .mode-focus .water { display: none; }
</style>
</head>
<body class="mode-focus">
<h1>Méditation dorée</h1>
<p class="sub">L'orbe du focus tenu entre deux mains, devant une roue dorée et une couronne de flammes. Personnage absent, seulement les symboles.</p>
<div class="modes">
  <button data-mode="focus" class="on">Focus (système solaire)</button>
  <button data-mode="pause">Pause (eau)</button>
</div>

<svg viewBox="0 0 600 640" aria-label="Orbe tenu entre deux mains">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#2b2140"/>
      <stop offset="0.85" stop-color="#140f22"/>
      <stop offset="1" stop-color="#f2c45a" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="sun" r="50%">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.35" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="handg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="1" stop-color="#c8902e"/>
    </linearGradient>
    <clipPath id="orbclip"><circle cx="300" cy="395" r="96"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Couronne de flammes (mandorle) -->
  <g class="flame" fill="none" stroke="#f2c45a" stroke-width="3" opacity="0.9">
    <path id="flames" d=""/>
  </g>
  <g class="flame f2" fill="none" stroke="#ffb347" stroke-width="1.5" opacity="0.5">
    <path id="flames2" d=""/>
  </g>

  <!-- Roue dorée en auréole -->
  <circle cx="300" cy="205" r="120" fill="url(#halo)"/>
  <g class="wheel" stroke="#f2c45a" fill="none">
    <circle cx="300" cy="205" r="92" stroke-width="5"/>
    <circle cx="300" cy="205" r="80" stroke-width="1.2" stroke-dasharray="3 5"/>
    <circle cx="300" cy="205" r="18" stroke-width="2"/>
    <g id="spokes" stroke-width="2"></g>
  </g>

  <!-- Syllabes sacrées -->
  <g font-size="54" fill="#ffd27a" text-anchor="middle" dominant-baseline="central" style="font-family: 'Noto Sans Devanagari', 'Nirmala UI', serif;">
    <text class="syl" x="110" y="250">अ</text>
    <text class="syl s2" x="490" y="250">हूं</text>
    <text class="syl s3" x="80" y="470">ह्रीः</text>
    <text class="syl s4" x="520" y="470">ॐ</text>
  </g>

  <!-- Orbe -->
  <circle class="orb-glow" cx="300" cy="395" r="130" fill="url(#halo)"/>
  <circle cx="300" cy="395" r="100" fill="url(#orb)" stroke="#f2c45a" stroke-width="2.5"/>
  <g clip-path="url(#orbclip)">
    <g class="solar">
      <g id="orbits" fill="none" stroke="rgba(255,231,163,0.18)" stroke-width="0.8"></g>
      <g id="back"></g>
      <circle cx="300" cy="395" r="22" fill="url(#sun)"/>
      <circle cx="300" cy="395" r="6.5" fill="#ffe7a3"/>
      <g id="front"></g>
      <path id="tail" fill="rgba(255,255,255,0.45)"/><circle id="head" r="2.2" fill="#fff"/>
    </g>
    <g class="water">
      <g transform="translate(0 420)">
        <g class="wave">
          <path d="M180 0 q22 -7 45 0 t45 0 t45 0 t45 0 t45 0 t45 0 t45 0 V 120 H 180 Z" fill="#7fd8e8" opacity="0.8"/>
          <path d="M180 4 q22 7 45 0 t45 0 t45 0 t45 0 t45 0 t45 0 t45 0 V 120 H 180 Z" fill="#bff0f7" opacity="0.45"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Main du dessous, en coupe -->
  <g fill="url(#handg)" stroke="#8a5a14" stroke-width="1.2" stroke-linejoin="round">
    <path d="M170 470
             C 175 520, 230 560, 300 562
             C 370 560, 425 520, 432 470
             C 440 462, 452 466, 450 480
             C 444 545, 380 592, 300 594
             C 220 592, 156 545, 150 480
             C 148 466, 162 462, 170 470 Z"/>
    <path d="M150 482 C 132 470, 128 452, 140 446 C 152 442, 160 456, 168 468 Z"/>
    <path d="M450 482 C 468 470, 472 452, 460 446 C 448 442, 440 456, 432 468 Z"/>
    <path d="M232 586 C 232 606, 268 618, 300 618 C 332 618, 368 606, 368 586 C 345 596, 255 596, 232 586 Z" opacity="0.9"/>
  </g>
  <!-- Main du dessus : doigts levés, le pouce et l'index se touchent au-dessus de l'orbe -->
  <g fill="url(#handg)" stroke="#8a5a14" stroke-width="1.2" stroke-linejoin="round">
    <path d="M318 300 C 322 258, 326 226, 334 214 C 340 206, 350 210, 349 222 L 343 292 Z"/>
    <path d="M343 296 C 352 256, 360 230, 368 222 C 375 216, 384 222, 381 233 L 364 300 Z"/>
    <path d="M362 304 C 374 270, 384 252, 392 248 C 399 245, 405 252, 401 262 L 380 312 Z"/>
    <path d="M298 300 C 290 286, 288 272, 296 266 C 304 262, 312 272, 318 300 Z"/>
    <path d="M296 300 C 300 330, 330 344, 362 336 C 384 330, 394 316, 390 304 L 380 312 L 364 300 L 343 296 L 318 300 Z"/>
    <circle cx="300" cy="292" r="7" fill="#fff7d6" stroke="none" opacity="0.9"/>
  </g>

  <!-- Chapelet -->
  <g fill="#6b4aa8" stroke="#2e1d52" stroke-width="1">
    <circle cx="470" cy="520" r="11"/><circle cx="486" cy="542" r="13"/><circle cx="498" cy="568" r="15"/>
  </g>
  <path d="M432 470 C 450 490, 462 505, 470 520" fill="none" stroke="#c8902e" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>
</svg>

<script>
  const ns = 'http://www.w3.org/2000/svg';
  // Flammes de la mandorle
  function flames(id, R, n, amp) {
    let d = '';
    const cx = 300, cy = 330;
    for (let i = 0; i <= n; i++) {
      const a0 = Math.PI * (1.08 + (i / n) * 0.84) - Math.PI / 2 - Math.PI / 2;
      const a = Math.PI + (i / n) * Math.PI; // demi-cercle supérieur
      const x = cx + R * Math.cos(a), y = cy + R * Math.sin(a) * 1.05;
      const tip = { x: cx + (R + amp) * Math.cos(a + 0.04), y: cy + (R + amp) * Math.sin(a + 0.04) * 1.05 };
      d += (i === 0 ? `M ${x} ${y}` : ` Q ${tip.x} ${tip.y} ${x} ${y}`);
    }
    document.getElementById(id).setAttribute('d', d);
  }
  flames('flames', 250, 14, 46);
  flames('flames2', 228, 18, 28);
  // Rayons de la roue
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const l = document.createElementNS(ns, 'line');
    l.setAttribute('x1', 300 + 18 * Math.cos(a)); l.setAttribute('y1', 205 + 18 * Math.sin(a));
    l.setAttribute('x2', 300 + 80 * Math.cos(a)); l.setAttribute('y2', 205 + 80 * Math.sin(a));
    document.getElementById('spokes').appendChild(l);
  }
  // Système solaire dans l'orbe
  const P = [[22,1.4,'#a8a39d',14],[30,2,'#e8cf9c',24],[39,2.2,'#4a8fd8',36],[47,1.7,'#c8532a',60],[60,4.4,'#d9b38c',140],[72,3.7,'#e6c97f',230,1],[82,2.7,'#9fe0e6',420],[91,2.6,'#4466d8',700]];
  const TILT = -14 * Math.PI / 180, F = 0.32, CX = 300, CY = 395;
  const back = document.getElementById('back'), front = document.getElementById('front');
  const pl = P.map(([r, s, c, per, ring], i) => {
    const o = document.createElementNS(ns, 'ellipse');
    o.setAttribute('cx', CX); o.setAttribute('cy', CY); o.setAttribute('rx', r); o.setAttribute('ry', r * F);
    o.setAttribute('transform', `rotate(-14 ${CX} ${CY})`); document.getElementById('orbits').appendChild(o);
    const g = document.createElementNS(ns, 'g');
    const ci = document.createElementNS(ns, 'circle'); ci.setAttribute('r', s); ci.setAttribute('fill', c); g.appendChild(ci);
    if (ring) { const e = document.createElementNS(ns, 'ellipse'); e.setAttribute('rx', s * 2.2); e.setAttribute('ry', s * 0.7); e.setAttribute('fill', 'none'); e.setAttribute('stroke', c); e.setAttribute('transform', 'rotate(-14)'); g.appendChild(e); }
    back.appendChild(g);
    return { r, per, g, ph: i * 1.7 };
  });
  const t0 = Date.now();
  function frame() {
    const t = Date.now() / 1000;
    for (const p of pl) {
      const a = p.ph + (t / p.per) * 2 * Math.PI;
      const ex = p.r * Math.cos(a), ey = p.r * F * Math.sin(a);
      const x = CX + ex * Math.cos(TILT) - ey * Math.sin(TILT), y = CY + ex * Math.sin(TILT) + ey * Math.cos(TILT);
      p.g.setAttribute('transform', `translate(${x} ${y}) scale(${1 + 0.22 * Math.sin(a)})`);
      const want = Math.sin(a) > 0 ? front : back; if (p.g.parentNode !== want) want.appendChild(p.g);
    }
    const prog = ((Date.now() - t0) / 60000) % 1; // démo : la comète arrive en 1 minute
    const d = 98 - prog * 84, ang = (-40 + prog * 70) * Math.PI / 180;
    const hx = CX + d * Math.cos(ang), hy = CY + d * Math.sin(ang), ux = Math.cos(ang), uy = Math.sin(ang), len = 12 + 16 * prog;
    document.getElementById('head').setAttribute('cx', hx); document.getElementById('head').setAttribute('cy', hy);
    document.getElementById('tail').setAttribute('d', `M ${hx - uy * 1.8} ${hy + ux * 1.8} L ${hx + ux * len} ${hy + uy * len} L ${hx + uy * 1.8} ${hy - ux * 1.8} Z`);
    requestAnimationFrame(frame);
  }
  frame();
  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
    document.body.className = 'mode-' + b.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach((x) => x.classList.toggle('on', x === b));
  }));
</script>
</body>
</html>
